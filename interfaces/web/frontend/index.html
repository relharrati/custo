<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custo Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }
        h1 { color: #00d9ff; }
        nav a {
            color: #888;
            text-decoration: none;
            margin-left: 20px;
        }
        nav a:hover { color: #00d9ff; }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
        }
        .chat-area {
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #0f0f23;
            border-radius: 4px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .message.user { background: #0f3460; margin-left: 20%; }
        .message.custo { background: #1a1a2e; margin-right: 20%; border: 1px solid #333; }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            background: #0f0f23;
            color: #eee;
            border-radius: 4px;
        }
        button {
            padding: 12px 24px;
            background: #00d9ff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #00b8d9; }
        .tag {
            display: inline-block;
            padding: 4px 8px;
            background: #0f3460;
            border-radius: 4px;
            font-size: 12px;
            margin: 4px;
        }
        #status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 8px 16px;
            background: #0f3460;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Custo</h1>
            <nav>
                <a href="#chat">Chat</a>
                <a href="#projects">Projects</a>
                <a href="#memory">Memory</a>
                <a href="#tasks">Tasks</a>
            </nav>
        </header>

        <div class="main-grid">
            <div class="panel">
                <h3>Quick Stats</h3>
                <p>Sessions today: <span id="session-count">--</span></p>
                <p>Active projects: <span id="project-count">--</span></p>
                <p>Memory entries: <span id="memory-count">--</span></p>

                <h3 style="margin-top: 20px;">Quick Actions</h3>
                <div>
                    <span class="tag">View tasks</span>
                    <span class="tag">Search memory</span>
                    <span class="tag">Create project</span>
                </div>
            </div>

            <div class="panel chat-area">
                <div class="messages" id="messages">
                    <div class="message custo">
                        Hello! I'm Custo, your autonomous digital operator. How can I help you today?
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="message-input" placeholder="Type your message..." />
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <div id="status">Connecting...</div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('message-input');
        const statusDiv = document.getElementById('status');

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            messagesDiv.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';

            try {
                statusDiv.textContent = 'Thinking...';
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                messagesDiv.innerHTML += `<div class="message custo">${data.response}</div>`;
                statusDiv.textContent = 'Ready';
            } catch (e) {
                messagesDiv.innerHTML += `<div class="message custo">Error: ${e.message}</div>`;
                statusDiv.textContent = 'Error';
            }

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Load stats
        async function loadStats() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                statusDiv.textContent = 'Connected';
            } catch (e) {
                statusDiv.textContent = 'Disconnected';
            }
        }

        loadStats();
    </script>
</body>
</html>
